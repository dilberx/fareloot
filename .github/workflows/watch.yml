name: watch

on:
  schedule:
    - cron: "7 * * * *" # hourly, offset from the hour to dodge GitHub's traffic spike
  # Seeding is a mode of this workflow, not a separate one: both write the same
  # price history, so they must share this concurrency group (two runs
  # force-pushing fareloot-data at once would drop one run's data) and the same
  # restore/persist steps, which guard against overwriting history.
  workflow_dispatch:
    inputs:
      mode:
        description: "poll = normal run; seed = bootstrap baselines (run until it reports a full cycle); test-alert = send one Telegram message to check the secrets; live-check = price one route live on Google Flights to check the SerpApi key; provider-check = compare Travelpayouts endpoints and markets on one route; analyze = report where the price history comes from (detail goes to Telegram)"
        type: choice
        options: [poll, seed, test-alert, live-check, provider-check, analyze]
        default: poll
      seed_destinations:
        description: "seed only: comma-separated destinations, e.g. SHJ,RKT (empty = all)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: fareloot-watch
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Restore price history
        id: restore
        # This step must never fail quietly. Persist force-pushes whatever ends up
        # in data/, so treating "remote unreachable" as "no history yet" would
        # overwrite the accumulated database with a one-run file and leave the old
        # commit unreachable. Past quotes cannot be re-fetched from Travelpayouts.
        #
        # git fetch cannot distinguish those cases: a missing branch and an
        # erroring remote both exit 128. ls-remote --exit-code separates them by
        # exit code alone, so failing loudly is possible without parsing
        # localisable stderr. Anything other than present-or-absent aborts the
        # job, which skips Persist and leaves the existing history untouched.
        #
        # The branch is public, so the database is stored encrypted: its rows name
        # every route polled, which is enough to reconstruct the private watchlist.
        # A missing key, a wrong key, or a file that fails SQLite's integrity check
        # all abort here, for the same reason as an unreachable remote.
        env:
          FARELOOT_DATA_KEY: ${{ secrets.FARELOOT_DATA_KEY }}
        run: |
          if [ -z "$FARELOOT_DATA_KEY" ]; then
            echo "::error::FARELOOT_DATA_KEY secret is not set; refusing to run so history is never stored unencrypted"
            exit 1
          fi
          mkdir -p data
          set +e
          git ls-remote --exit-code origin refs/heads/fareloot-data >/dev/null 2>&1
          code=$?
          set -e
          case "$code" in
            0)
              git fetch --depth=1 origin fareloot-data:refs/remotes/origin/fareloot-data
              if git cat-file -e origin/fareloot-data:fareloot.db.enc 2>/dev/null; then
                git show origin/fareloot-data:fareloot.db.enc > "$RUNNER_TEMP/fareloot.db.enc"
                openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:FARELOOT_DATA_KEY                   -in "$RUNNER_TEMP/fareloot.db.enc" -out data/fareloot.db
              elif git cat-file -e origin/fareloot-data:fareloot.db 2>/dev/null; then
                git show origin/fareloot-data:fareloot.db > data/fareloot.db
                echo "found unencrypted history; it will be stored encrypted from this run on"
              else
                echo "::error::fareloot-data exists but holds no database; aborting"
                exit 1
              fi
              python3 -c 'import sqlite3, sys; r = sqlite3.connect(sys.argv[1]).execute("PRAGMA integrity_check").fetchone()[0]; sys.exit(0 if r == "ok" else "integrity_check: " + r)' data/fareloot.db
              echo "restored $(stat -c%s data/fareloot.db) bytes of price history"
              ;;
            2)
              echo "no fareloot-data branch yet - starting with an empty database"
              ;;
            *)
              echo "::error::cannot reach origin to check for fareloot-data (ls-remote exit $code);"\
                   "aborting so Persist does not overwrite existing history"
              exit 1
              ;;
          esac

      - uses: astral-sh/setup-uv@v10.3.0  # setup-uv publishes only exact version tags, no floating v10

      - name: Install
        run: uv sync --no-dev

      - name: Materialise watchlist
        # config/watchlist.yaml is gitignored so a personal travel wishlist is
        # never public. The deployed watcher gets it from a secret instead.
        env:
          WATCHLIST: ${{ secrets.FARELOOT_WATCHLIST_YAML }}
        run: |
          mkdir -p config
          if [ -n "$WATCHLIST" ]; then
            printf '%s' "$WATCHLIST" > config/watchlist.yaml
            echo "watchlist loaded from secret ($(wc -l < config/watchlist.yaml) lines)"
          else
            uv run fareloot init
            echo "NOTE: no FARELOOT_WATCHLIST_YAML secret set - polling built-in defaults"
          fi

      - name: Seed
        if: ${{ inputs.mode == 'seed' }}
        env:
          FARELOOT_TP_TOKEN: ${{ secrets.FARELOOT_TP_TOKEN }}
          # Passed through env, not interpolated into the script, so the input
          # can't inject shell.
          SEED_DESTINATIONS: ${{ inputs.seed_destinations }}
        run: uv run fareloot seed --destinations "$SEED_DESTINATIONS"

      - name: Test alert
        # A poll that finds no deals never touches Telegram, so wrong Telegram
        # secrets would stay invisible until the first real deal. This sends one
        # message with the secrets exactly as stored.
        if: ${{ inputs.mode == 'test-alert' }}
        env:
          FARELOOT_TELEGRAM_BOT_TOKEN: ${{ secrets.FARELOOT_TELEGRAM_BOT_TOKEN }}
          FARELOOT_TELEGRAM_CHAT_ID: ${{ secrets.FARELOOT_TELEGRAM_CHAT_ID }}
        run: uv run fareloot test-alert

      - name: Live check
        # Spends two SerpApi searches: proves the key works and shows whether the
        # round-trip price covers both legs.
        if: ${{ inputs.mode == 'live-check' }}
        env:
          FARELOOT_SERPAPI_KEY: ${{ secrets.FARELOOT_SERPAPI_KEY }}
        run: uv run fareloot live-check

      - name: Provider check
        # Spends 4 Travelpayouts calls comparing v1, v3, and markets on one route.
        if: ${{ inputs.mode == 'provider-check' }}
        env:
          FARELOOT_TP_TOKEN: ${{ secrets.FARELOOT_TP_TOKEN }}
        run: uv run fareloot provider-check

      - name: Analyze
        # Reads the decrypted history. The log gets totals only; destinations,
        # which reveal the private watchlist, go to Telegram.
        if: ${{ inputs.mode == 'analyze' }}
        env:
          FARELOOT_TELEGRAM_BOT_TOKEN: ${{ secrets.FARELOOT_TELEGRAM_BOT_TOKEN }}
          FARELOOT_TELEGRAM_CHAT_ID: ${{ secrets.FARELOOT_TELEGRAM_CHAT_ID }}
        run: uv run fareloot analyze --notify telegram

      - name: Poll
        # Scheduled runs have no inputs, so an empty mode means poll.
        if: ${{ inputs.mode != 'seed' && inputs.mode != 'test-alert' && inputs.mode != 'live-check' && inputs.mode != 'provider-check' && inputs.mode != 'analyze' }}
        env:
          FARELOOT_TP_TOKEN: ${{ secrets.FARELOOT_TP_TOKEN }}
          FARELOOT_TELEGRAM_BOT_TOKEN: ${{ secrets.FARELOOT_TELEGRAM_BOT_TOKEN }}
          FARELOOT_TELEGRAM_CHAT_ID: ${{ secrets.FARELOOT_TELEGRAM_CHAT_ID }}
          # Optional: without it, alerts are sent labelled as not live-checked.
          FARELOOT_SERPAPI_KEY: ${{ secrets.FARELOOT_SERPAPI_KEY }}
        run: uv run fareloot poll --notify telegram

      - name: Persist price history
        # Force-pushed as a single commit to an orphan branch, not committed to
        # main - an hourly binary DB would otherwise balloon the repo forever.
        #
        # Runs even when Poll failed, so a Telegram outage or a missing chat id
        # does not throw away the prices that were already collected; the job
        # still goes red. Gated on a successful restore, because pushing after
        # an inconclusive restore would overwrite the accumulated history.
        if: ${{ !cancelled() && inputs.mode != 'test-alert' && inputs.mode != 'live-check' && inputs.mode != 'provider-check' && inputs.mode != 'analyze' && steps.restore.outcome == 'success' && hashFiles('data/fareloot.db') != '' }}
        env:
          FARELOOT_DATA_KEY: ${{ secrets.FARELOOT_DATA_KEY }}
        run: |
          if [ -e data/fareloot.db-journal ]; then
            echo "::error::hot SQLite journal present - the poll was killed mid-write; not persisting"
            exit 1
          fi
          enc="$RUNNER_TEMP/fareloot.db.enc"
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -pass env:FARELOOT_DATA_KEY             -in data/fareloot.db -out "$enc"
          # Prove the file decrypts back to this exact database before it is
          # allowed to replace the stored history.
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:FARELOOT_DATA_KEY             -in "$enc" -out "$RUNNER_TEMP/roundtrip.db"
          cmp data/fareloot.db "$RUNNER_TEMP/roundtrip.db"
          echo "persisting $(stat -c%s data/fareloot.db) bytes of price history, encrypted"
          git checkout --orphan fareloot-data
          git rm -rf . >/dev/null 2>&1 || true
          cp "$enc" fareloot.db.enc
          git add fareloot.db.enc
          git -c user.name="fareloot-bot" -c user.email="actions@users.noreply.github.com" \
            commit -m "data: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push --force origin HEAD:fareloot-data
