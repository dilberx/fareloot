name: watch

on:
  schedule:
    - cron: "7 * * * *" # hourly, offset from the hour to dodge GitHub's traffic spike
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fareloot-watch
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore price history
        # This step must never fail quietly. Persist force-pushes whatever ends up
        # in data/, so treating "remote unreachable" as "no history yet" would
        # overwrite the accumulated database with a one-run file and leave the old
        # commit unreachable. Past quotes cannot be re-fetched from Travelpayouts.
        #
        # git fetch cannot distinguish those cases: a missing branch and an
        # erroring remote both exit 128. ls-remote --exit-code separates them by
        # exit code alone, so failing loudly is possible without parsing
        # localisable stderr. Anything other than present-or-absent aborts the
        # job, which skips Persist and leaves the existing history untouched.
        run: |
          mkdir -p data
          set +e
          git ls-remote --exit-code origin refs/heads/fareloot-data >/dev/null 2>&1
          code=$?
          set -e
          case "$code" in
            0)
              git fetch --depth=1 origin fareloot-data:refs/remotes/origin/fareloot-data
              git show origin/fareloot-data:fareloot.db > data/fareloot.db
              echo "restored $(stat -c%s data/fareloot.db) bytes of price history"
              ;;
            2)
              echo "no fareloot-data branch yet - starting with an empty database"
              ;;
            *)
              echo "::error::cannot reach origin to check for fareloot-data (ls-remote exit $code);"\
                   "aborting so Persist does not overwrite existing history"
              exit 1
              ;;
          esac

      - uses: astral-sh/setup-uv@v3

      - name: Install
        run: uv sync --no-dev

      - name: Materialise watchlist
        # config/watchlist.yaml is gitignored so a personal travel wishlist is
        # never public. The deployed watcher gets it from a secret instead.
        env:
          WATCHLIST: ${{ secrets.FARELOOT_WATCHLIST_YAML }}
        run: |
          mkdir -p config
          if [ -n "$WATCHLIST" ]; then
            printf '%s' "$WATCHLIST" > config/watchlist.yaml
            echo "watchlist loaded from secret ($(wc -l < config/watchlist.yaml) lines)"
          else
            uv run fareloot init
            echo "NOTE: no FARELOOT_WATCHLIST_YAML secret set - polling built-in defaults"
          fi

      - name: Poll
        env:
          FARELOOT_TP_TOKEN: ${{ secrets.FARELOOT_TP_TOKEN }}
          FARELOOT_TELEGRAM_BOT_TOKEN: ${{ secrets.FARELOOT_TELEGRAM_BOT_TOKEN }}
          FARELOOT_TELEGRAM_CHAT_ID: ${{ secrets.FARELOOT_TELEGRAM_CHAT_ID }}
        run: uv run fareloot poll --notify telegram

      - name: Persist price history
        # Force-pushed as a single commit to an orphan branch, not committed to
        # main - an hourly binary DB would otherwise balloon the repo forever.
        run: |
          cp data/fareloot.db /tmp/fareloot.db
          echo "persisting $(stat -c%s /tmp/fareloot.db) bytes of price history"
          git checkout --orphan fareloot-data
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/fareloot.db fareloot.db
          git add fareloot.db
          git -c user.name="fareloot-bot" -c user.email="actions@users.noreply.github.com" \
            commit -m "data: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push --force origin HEAD:fareloot-data
