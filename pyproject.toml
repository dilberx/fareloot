[project]
name = "fareloot"
version = "0.1.0"
description = "Catches abnormally cheap round trips from airports reachable from Kerala."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "PyYAML>=6.0",
]

[project.scripts]
fareloot = "fareloot.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fareloot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# StrEnum (UP042's suggestion) needs Python 3.12; this project targets 3.11.
ignore = ["UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
